packages:
  - "apps/*"
  - "packages/*"

# Reuse shared versions on `pnpm add`; reject conflicting default-catalog ranges.
catalogMode: strict

allowBuilds:
  "@medusajs/telemetry": true
  "@parcel/watcher": true
  "@swc/core": true
  "@vercel/git-hooks": true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true

catalog:
  "@tailwindcss/postcss": ^4.3.3
  "@types/node": ^26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  algoliasearch: ^5.60.0
  axios: ^1.20.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  cross-env: ^10.1.0
  dotenv: ^18.0.9
  geist: ^1.8.2
  graphql: ^17.0.2
  lucide-react: ^1.61.0
  motion: ^14.6.0
  next-themes: ^0.4.6
  postcss: ^8.5.31
  prism-react-renderer: ^2.4.1
  qs: ^6.16.1
  react: 19.3.1
  react-dom: 19.3.1
  react-hook-form: ^7.91.0
  react-email: ^6.11.3
  resend: ^6.34.1
  pdfmake: ^0.3.12
  sharp: ^0.35.5
  sonner: ^2.0.8
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^6.0.3
  zod: ^4.6.7

# Upgrade each framework family together. Medusa UI has its own release version.
catalogs:
  medusa:
    "@medusajs/admin-sdk": 2.22.1
    "@medusajs/admin-shared": 2.22.1
    "@medusajs/analytics-posthog": 2.22.1
    "@medusajs/cli": 2.22.1
    "@medusajs/dashboard": 2.22.1
    "@medusajs/draft-order": 2.22.1
    "@medusajs/framework": 2.22.1
    "@medusajs/icons": 2.22.1
    "@medusajs/js-sdk": 2.22.1
    "@medusajs/medusa": 2.22.1
    "@medusajs/types": 2.22.1
    "@medusajs/ui": 4.2.8
    "@medusajs/ui-preset": 2.22.1
  mikro-orm:
    "@mikro-orm/cli": 6.6.14
    "@mikro-orm/core": 6.6.14
    "@mikro-orm/knex": 6.6.14
    "@mikro-orm/migrations": 6.6.14
    "@mikro-orm/postgresql": 6.6.14
  payload:
    "@payloadcms/db-postgres": 4.0.0-beta.4
    "@payloadcms/email-resend": 4.0.0-beta.4
    "@payloadcms/live-preview-react": 4.0.0-beta.4
    "@payloadcms/next": 4.0.0-beta.4
    "@payloadcms/plugin-form-builder": 4.0.0-beta.4
    "@payloadcms/plugin-nested-docs": 4.0.0-beta.4
    "@payloadcms/plugin-redirects": 4.0.0-beta.4
    "@payloadcms/plugin-search": 4.0.0-beta.4
    "@payloadcms/plugin-seo": 4.0.0-beta.4
    "@payloadcms/richtext-lexical": 4.0.0-beta.4
    "@payloadcms/storage-s3": 4.0.0-beta.4
    "@payloadcms/transformer-sharp": 4.0.0-beta.4
    "@payloadcms/translations": 4.0.0-beta.4
    "@payloadcms/ui": 4.0.0-beta.4
    payload: 4.0.0-beta.4
  storefront:
    next: 16.4.3
    typescript: ^7.0.2

minimumReleaseAge: 60
